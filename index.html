<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gestionale Studio Commercialista</title>
<meta name="theme-color" content="#f5f5f7">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  /* Layout: sidebar fissa a sinistra su desktop, barra di scorrimento in alto su telefono; contenuto a card bianche. Tema chiaro di base, scuro su richiesta. */
  --bg:#f5f5f7; --surface:#ffffff; --fg:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --soft:#f2f2f4;
  --accent:#0071e3; --accent-bg:#e8f1fc; --ink:#1d1d1f; --ok:#1f8a4c; --ok-bg:#e8f5ed; --warn:#a36200; --warn-bg:#fff3dc; --bad:#c42b2b; --bad-bg:#fdeaea; --info:#3a3a3c; --info-bg:#ececf0;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;margin:0;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
input,textarea,select{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{font-weight:650;font-size:15px;letter-spacing:-.01em;padding:4px 10px 18px;line-height:1.25}
.brand small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px;position:relative}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 12px;border-radius:9px;color:var(--muted);font-weight:550;display:flex;justify-content:space-between;align-items:center;gap:8px;transition:background .15s,color .15s}
.nav button:hover{background:var(--soft);color:var(--fg)}
.nav button[aria-current="page"]{background:transparent;color:#fff}
.nav button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.tab:focus-visible,tr[tabindex]:focus-visible,.back:focus-visible,.day:focus-visible,.chip:focus-visible,.clink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav .count{font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px;font-weight:600}
.nav .count.w{background:#e8a200;color:#1d1d1f}
.nav .count.b{background:var(--muted)}
.nav button[aria-current="page"] .count{background:#fff;color:var(--accent)}
.sep{height:1px;background:var(--line);margin:12px 8px}
.user{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px;flex:0 0 auto}
.user b{display:block;font-weight:600}.user span{color:var(--muted);font-size:12px}
.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.banner{background:var(--accent-bg);color:var(--accent);border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:600}
.me{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px}
.me select{font-size:13px;padding:5px 8px}
main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0;max-width:1180px;width:100%}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 4px;font-weight:700;text-wrap:balance}
h2{font-size:17px;letter-spacing:-.01em;margin:0 0 12px;font-weight:650}
h3{font-size:14px;margin:0 0 6px;font-weight:650}
.sub{color:var(--muted);margin:0 0 22px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.stat .n{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:12.5px;margin-top:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.row .grow{flex:1 1 200px;min-width:0}
.btn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--accent);color:#fff;padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;white-space:nowrap;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn.sec{background:var(--soft);color:var(--fg);border:1px solid var(--line)}
.btn.no{background:var(--bad-bg);color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
input[type=text],input[type=search],input[type=tel],input[type=email],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 11px;min-width:0;width:100%}
select{width:auto;max-width:100%}
textarea{resize:vertical;min-height:70px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr[data-open]{cursor:pointer}
tbody tr[data-open]:hover{background:var(--soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)}.warn{background:var(--warn-bg);color:var(--warn)}.bad{background:var(--bad-bg);color:var(--bad)}.info{background:var(--info-bg);color:var(--info)}.acc{background:var(--accent-bg);color:var(--accent)}
.list{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{min-width:0}.item .t b{font-weight:600}.item .t span{display:block;color:var(--muted);font-size:12.5px}
.item .acts{display:flex;gap:6px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end}
.subh{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:650;margin:12px 0 2px}
.subh:first-child{margin-top:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tab{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 13px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;flex:0 0 auto;padding:7px 12px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;min-height:34px;display:inline-flex;align-items:center}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.boardw{position:relative}.boardw.fade::after{content:'';position:absolute;top:0;bottom:0;right:0;width:56px;pointer-events:none;border-radius:0 14px 14px 0;background:linear-gradient(to right,rgba(245,245,247,0),var(--bg))}
.board{overflow-x:auto;padding:6px;margin:-6px;border-radius:14px}
.cols{display:grid;grid-template-columns:repeat(7,224px);gap:14px;align-items:start;width:max-content}
.cols.one{grid-template-columns:minmax(0,1fr);width:auto}
.col{min-width:0;border-radius:12px;padding:6px;margin:-6px;transition:background .15s}
.col.over{background:var(--accent-bg)}
.col h3{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:grab}
.pcard.drag{opacity:.45}
.pcard small{color:var(--muted);display:block;margin-top:3px}
.pcard select{width:100%;margin-top:8px;font-size:12px;padding:5px 8px}
.kv{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px 14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.note{padding:10px 0;border-bottom:1px solid var(--line)}.note:last-child{border-bottom:0}.note small{color:var(--muted)}
.back{all:unset;cursor:pointer;color:var(--accent);font-weight:600;margin-bottom:12px;display:inline-block}
.back:hover{opacity:.75}
.flow{display:flex;gap:0;align-items:stretch;flex-wrap:wrap}
.step{flex:1 1 170px;min-width:150px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px}
.step b{display:block;margin-bottom:4px}
.arrow{align-self:center;padding:0 8px;color:var(--muted);font-size:18px}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qrimg{background:#fff;padding:10px;border:1px solid var(--line);border-radius:12px;width:fit-content;min-width:168px;min-height:168px;display:grid;place-items:center}
.qrfb{width:148px;height:148px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12.5px;background:var(--soft);border-radius:8px;padding:12px}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em}
.day{min-height:78px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;font-size:12px;min-width:0;overflow:hidden;cursor:pointer}
.day.today{border-color:var(--accent)}.day.mute{background:transparent;border-style:dashed;cursor:default}
.day.off{background:var(--soft)}
.day.sel{box-shadow:0 0 0 2px var(--accent) inset}
.day .d{font-weight:600;margin-bottom:3px}
.day .hol{display:block;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev{display:block;border-radius:5px;padding:1px 5px;margin-top:2px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:none;width:7px;height:7px;border-radius:50%;margin:3px 2px 0 0;vertical-align:middle}
.dot.info{background:var(--info)}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.acc{background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 0;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend i.sq{border-radius:3px;background:var(--soft);border:1px solid var(--line)}
.legend i.acc{background:var(--accent)}.legend i.bad{background:var(--bad)}.legend i.warn{background:#e8a200}.legend i.ok{background:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal[hidden]{display:none!important}
.sheet{background:var(--surface);border-radius:16px;padding:20px;width:min(620px,100%);max-height:88vh;overflow:auto}
.sheet.wide{width:min(720px,100%)}
.sheet textarea{min-height:70px}
.sheet textarea.mono{min-height:220px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:pre}
.sheet .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-weight:600;font-size:13px;z-index:60;max-width:calc(100vw - 32px);text-align:center}
.toast.top{bottom:auto;top:calc(14px + env(safe-area-inset-top,0px))}
.f{margin-bottom:12px;min-width:0}
.f label{display:block;margin-bottom:4px;color:var(--muted);font-size:13px}
.f .hint{margin-top:4px}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.frow3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}
.ferr{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:9px 12px;font-weight:600;margin-top:10px}
.wbox{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 12px;margin:10px 0;font-size:13px}
.wbox ul{margin:4px 0 0;padding-left:18px}
.upload{max-width:460px;margin:8vh auto;padding:0 16px}
.upload label{display:block;margin-bottom:4px;color:var(--muted)}
.upload .f{margin-bottom:12px}
.explain .card p{margin:0 0 8px;color:var(--muted)}
.explain ol{margin:0;padding-left:18px;color:var(--muted)}
.expired{max-width:420px;margin:18vh auto;padding:0 16px;text-align:center}
.gs{margin-bottom:16px}
.gs input{padding:10px 14px;border-radius:12px;background:var(--surface)}
.gsres{margin-top:6px}
.sem{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;flex:0 0 auto}
.sem.ok{background:var(--ok)}.sem.warn{background:#e8a200}.sem.bad{background:var(--bad)}
.clink{cursor:pointer;color:var(--accent);font-weight:600}
.hint{color:var(--muted);font-size:12.5px}
@media (max-width:820px){
  .g5{grid-template-columns:1fr 1fr}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;height:auto;top:env(safe-area-inset-top,0px);z-index:20;border-right:0;border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
  .brand{padding:0 4px}.brand small{display:none}
  .user{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav.fade-r{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent)}
  .nav.fade-l{-webkit-mask-image:linear-gradient(to right,transparent,#000 36px);mask-image:linear-gradient(to right,transparent,#000 36px)}
  .nav.fade-l.fade-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 36px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to right,transparent,#000 36px,#000 calc(100% - 36px),transparent)}
  .nav button{white-space:nowrap;flex:0 0 auto}
  .sep{display:none}
  main{padding-top:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1{font-size:23px}
  .kv{grid-template-columns:1fr;gap:2px 0}.kv dt{margin-top:8px}
  .arrow{transform:rotate(90deg);flex:1 1 100%;text-align:center;padding:4px 0}
  .cal{gap:3px}.day{min-height:52px;padding:4px}.ev{display:none}.day .dot{display:inline-block}.day .hol{display:none}
  .nav button{min-height:40px;padding:8px 13px}
  input[type=text],input[type=search],input[type=tel],input[type=email],input[type=date],input[type=time],input[type=number],select,textarea{font-size:16px}
  select{width:100%}
  .me select{width:auto}
  .row .btn{flex:1 1 auto;text-align:center}
  .g4{grid-template-columns:1fr 1fr}.stat .n{font-size:22px}
  .card{padding:14px;border-radius:12px}
  .tablewrap{border:0;background:transparent;overflow:visible}
  table{min-width:0;display:block}
  thead{display:none}
  tbody{display:block}
  tbody tr{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  tbody tr td{display:inline-block;border:0;padding:1px 8px 1px 0;vertical-align:middle;color:var(--muted);font-size:13px}
  tbody tr td[data-l]::before{content:attr(data-l) ": ";font-size:12px}
  tbody tr td:first-child{display:block;width:100%;color:var(--fg);font-size:14px;padding:0 0 3px}
  tbody tr td.num{text-align:left;color:var(--fg);font-weight:600}
  .item{align-items:flex-start;flex-wrap:wrap}.item .pill{margin-top:2px}
  .tabs{overflow-x:auto;flex-wrap:nowrap}.tab{white-space:nowrap}
  .sheet{padding:16px}
  .frow,.frow3{grid-template-columns:1fr}
  .topbar{align-items:flex-start}
}

.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;padding:6px 14px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);text-align:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fpanel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;display:grid;gap:8px}
.fqbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-bg);color:var(--accent);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.quick{margin-bottom:14px}
.kpi{display:block;width:100%;text-align:left;cursor:pointer;position:relative;font:inherit;color:inherit;transition:transform .15s,box-shadow .15s,border-color .15s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.07);border-color:#d2d2d7}
.kpi:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpi .go{position:absolute;right:14px;top:12px;color:var(--muted);font-size:18px;line-height:1}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:14px 8px;color:var(--muted)}
.empty svg{color:var(--ok);margin-bottom:4px}.empty b{color:var(--fg);font-weight:600;font-size:13px}.empty span{font-size:12.5px}
.hb{display:flex;flex-direction:column;gap:9px}
.hbr{display:grid;grid-template-columns:minmax(90px,38%) minmax(0,1fr) 24px;gap:10px;align-items:center;font-size:13px}
.hbl{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbt{display:block;height:10px;background:var(--soft);border-radius:99px;overflow:hidden;cursor:pointer}
.hbt i{display:block;height:100%;background:var(--accent);border-radius:99px;transform-origin:left}
.hbr b{text-align:right;font-variant-numeric:tabular-nums}
.lc svg{width:100%;height:auto;max-width:560px;display:block;overflow:visible}
.gl{stroke:var(--line);stroke-width:1}.ax{fill:var(--muted);font-size:10px}.vl{fill:var(--fg);font-size:10px;font-weight:600}
@media (max-width:820px){.ax,.vl{font-size:13.5px}.lc svg{max-width:none}}
.rtc{display:none}
@media (max-width:820px){.rtfull{display:none}.rtc{display:block;border:1px solid var(--line);background:var(--surface);border-radius:12px;overflow:hidden}

.rtc thead th{font-size:12px;color:var(--muted);font-weight:600;padding:9px 6px;text-transform:none;letter-spacing:0;text-align:left;border-bottom:1px solid var(--line)}.rtc thead th.num{text-align:right}
.rtc tbody tr{display:table-row;background:transparent;border:0;border-radius:0;padding:0;margin:0}
