:root{
  /* Layout: sidebar fissa a sinistra su desktop, barra di scorrimento in alto su telefono; contenuto a card bianche */
  --bg:#f5f5f7; --surface:#ffffff; --fg:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --soft:#f2f2f4;
  --ink:#1d1d1f; --ok:#1f8a4c; --ok-bg:#e8f5ed; --warn:#a36200; --warn-bg:#fff3dc; --bad:#c42b2b; --bad-bg:#fdeaea; --info:#3a3a3c; --info-bg:#ececf0;

  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;margin:0;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto}
.brand{font-weight:650;font-size:15px;letter-spacing:-.01em;padding:4px 10px 18px;line-height:1.25}
.brand small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 12px;border-radius:9px;color:var(--muted);font-weight:550;display:flex;justify-content:space-between;align-items:center;gap:8px;transition:background .15s,color .15s}
.nav button:hover{background:var(--soft);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--ink);color:#fff}
.nav button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.tab:focus-visible,tr[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.nav .count{font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px;font-weight:600}
.nav button[aria-current="page"] .count{background:#fff;color:var(--ink)}
.sep{height:1px;background:var(--line);margin:12px 8px}
main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0;max-width:1180px;width:100%}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 4px;font-weight:700;text-wrap:balance}
h2{font-size:17px;letter-spacing:-.01em;margin:0 0 12px;font-weight:650}
h3{font-size:14px;margin:0 0 6px;font-weight:650}
.sub{color:var(--muted);margin:0 0 22px}
.demo-note{display:inline-block;background:var(--info-bg);color:var(--info);border-radius:99px;padding:3px 11px;font-size:12px;font-weight:550;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.stat .n{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:12.5px;margin-top:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.row .grow{flex:1 1 200px;min-width:0}
.btn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--ink);color:#fff;padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;white-space:nowrap;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn.sec{background:var(--soft);color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:12px}
input[type=text],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 11px;min-width:0;width:100%}
select{width:auto;max-width:100%}
textarea{resize:vertical;min-height:70px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr[data-open]{cursor:pointer}
tbody tr[data-open]:hover{background:var(--soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)}.warn{background:var(--warn-bg);color:var(--warn)}.bad{background:var(--bad-bg);color:var(--bad)}.info{background:var(--info-bg);color:var(--info)}
.list{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{min-width:0}.item .t b{font-weight:600}.item .t span{display:block;color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tab{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 13px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px;align-items:start}
.col h3{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.pcard small{color:var(--muted);display:block;margin-top:3px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.note{padding:10px 0;border-bottom:1px solid var(--line)}.note:last-child{border-bottom:0}.note small{color:var(--muted)}
.back{all:unset;cursor:pointer;color:var(--muted);font-weight:600;margin-bottom:12px;display:inline-block}
.back:hover{color:var(--fg)}
.flow{display:flex;gap:0;align-items:stretch;flex-wrap:wrap}
.step{flex:1 1 170px;min-width:150px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px}
.step b{display:block;margin-bottom:4px}
.arrow{align-self:center;padding:0 8px;color:var(--muted);font-size:18px}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qrimg{background:#fff;padding:10px;border:1px solid var(--line);border-radius:12px;width:fit-content}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em}
.day{min-height:78px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;font-size:12px;min-width:0;overflow:hidden}
.day.today{border-color:var(--ink)}.day.mute{background:transparent;border-style:dashed}
.day .d{font-weight:600;margin-bottom:3px}
.ev{display:block;border-radius:5px;padding:1px 5px;margin-top:2px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:none;width:7px;height:7px;border-radius:50%;margin:3px 2px 0 0;vertical-align:middle}
.dot.info{background:var(--info)}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.mobile-note{display:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:12.5px;margin:0 0 14px}
.mobile-note b{color:var(--fg)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal[hidden]{display:none!important}
.sheet{background:var(--surface);border-radius:16px;padding:20px;width:min(620px,100%);max-height:88vh;overflow:auto}
.sheet textarea{min-height:220px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:pre}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-weight:600;font-size:13px;z-index:60}
.upload{max-width:460px;margin:8vh auto;padding:0 16px}
.explain .card p{margin:0 0 8px;color:var(--muted)}
.explain ol{margin:0;padding-left:18px;color:var(--muted)}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;height:auto;top:env(safe-area-inset-top,0px);z-index:20;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
  .brand{padding:0 4px}.brand small{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  .nav button{white-space:nowrap;flex:0 0 auto}
  .sep{display:none}
  main{padding-top:20px}
  h1{font-size:23px}
  .kv{grid-template-columns:1fr;gap:2px 0}.kv dt{margin-top:8px}
  .arrow{transform:rotate(90deg);flex:1 1 100%;text-align:center;padding:4px 0}
  .cal{gap:3px}.day{min-height:52px;padding:4px}.ev{display:none}.day .dot{display:inline-block}
  .mobile-note{display:block}
  .nav button{min-height:40px;padding:8px 13px}
  input[type=text],input[type=search],select,textarea{font-size:16px}
  select{width:100%}
  .row .btn{flex:1 1 auto;text-align:center}
  .g4{grid-template-columns:1fr 1fr}.stat .n{font-size:22px}
  .card{padding:14px;border-radius:12px}
  .tablewrap{border:0;background:transparent;overflow:visible}
  table{min-width:0;display:block}
  thead{display:none}
  tbody{display:block}
  tbody tr{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  tbody tr td{display:inline-block;border:0;padding:1px 8px 1px 0;vertical-align:middle;color:var(--muted);font-size:13px}
  tbody tr td:first-child{display:block;width:100%;color:var(--fg);font-size:14px;padding:0 0 3px}
  tbody tr td.num{text-align:left;color:var(--fg);font-weight:600}
  .item{align-items:flex-start}.item .pill{margin-top:2px}
  .tabs{overflow-x:auto;flex-wrap:nowrap}.tab{white-space:nowrap}
  .sheet{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  SCAD.forEach(function(s){if(s.st!=='chiusa'&&iso(s.d)===key){var st=scadStato(s);evs+='<span class="ev '+st.c+'">'+esc(s.tipo)+' · '+esc(cl(s.c).nome.split(' ')[0])+'</span>';dots+='<i class="dot '+st.c+'"></i>'}});
  evs=dots+evs;
  cells+='<div class="day'+(key===iso(TODAY)?' today':'')+'"><div class="d">'+d+'</div>'+evs+'</div>';}
 return '<h1>Agenda</h1><p class="sub">Appuntamenti con i clienti e scadenze, nello stesso calendario.</p>'
 +'<div class="row"><button class="btn sec sm" id="calp" aria-label="Mese precedente">←</button><b style="text-transform:capitalize;min-width:140px;text-align:center">'+label+'</b><button class="btn sec sm" id="caln" aria-label="Mese successivo">→</button></div><div class="cal">'+cells+'</div>'
 +'<div class="card" style="margin-top:18px"><h2>Prossimi appuntamenti</h2><div class="list">'+APP.map(function(a){return '<div class="item"><div class="t"><b>'+esc(a.t)+'</b><span>'+fmt(a.d)+' alle '+a.h+'</span></div></div>'}).join('')+'</div></div>';
}
function vHow(){
 var sezioni=[
  ['Dashboard','Mostra a colpo d\'occhio cosa richiede attenzione oggi.',['Controlla le scadenze scadute e quelle della settimana.','Guarda i documenti mancanti e le pratiche da firmare.','Apri la sezione indicata per intervenire.']],
  ['Anagrafica clienti','Raccoglie i dati di ogni cliente, il regime fiscale e le deleghe.',['Cerca il cliente o filtra per regime.','Apri la scheda per scadenze, documenti, pratiche e note.','Controlla le deleghe: cassetto fiscale, F24, PEC e firma.']],
  ['Scadenzario fiscale','Elenca tutte le scadenze, generali o di un solo cliente.',['Scegli un cliente per vedere solo le sue scadenze.','Filtra per tipo (F24, IVA, 730, contributi) o per stato.','Esporta l\'elenco in CSV quando serve.']],
  ['Documenti','Dice cosa è arrivato e cosa manca per ogni cliente.',['Guarda l\'elenco dei documenti mancanti, in ordine di urgenza.','Scegli la cartella di un cliente per vederne i file.','Il codice QR permette al cliente di caricare da solo un documento.']],
  ['Pratiche in corso','Segue ogni lavoro aperto dallo studio fino alla chiusura.',['Passa dalla vista a colonne all\'elenco.','Controlla stato, responsabile e prossima azione.','Aggiungi una nota alla pratica con data.']],
  ['Fatturazione','Tiene il conto delle parcelle emesse e da incassare.',['Controlla totale emesso, incassato e in ritardo.','Individua le parcelle da sollecitare.','Esporta l\'elenco in CSV per la contabilità.']],
  ['Agenda','Unisce appuntamenti e scadenze in un solo calendario.',['Sfoglia i mesi con le frecce.','Appuntamenti e scadenze hanno colori diversi.','Controlla l\'elenco dei prossimi appuntamenti sotto il calendario.']]
 ];
 return '<span class="demo-note">Questa è una demo con dati di esempio: tutto verrà personalizzato sulla tua attività.</span><h1>Come funziona</h1><p class="sub">Una breve guida a ogni sezione del gestionale.</p>'
 +'<div class="grid g3 explain">'+sezioni.map(function(s){return '<div class="card"><h2>'+s[0]+'</h2><p>'+s[1]+'</p><ol>'+s[2].map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol></div>'}).join('')+'</div>'
 +'<div class="card" style="margin-top:14px"><h2>Come funziona l\'automazione collegata</h2><p class="sub" style="margin-top:-6px">È un servizio separato e facoltativo: il gestionale funziona anche senza.</p>'
 +'<div class="flow"><div class="step"><b>1. Il cliente invia il documento</b>Lo manda su WhatsApp allo studio, come un normale messaggio.</div><div class="arrow">→</div><div class="step"><b>2. Archiviazione automatica</b>Il documento finisce nella cartella giusta del cliente.</div><div class="arrow">→</div><div class="step"><b>3. Promemoria se manca qualcosa</b>Il cliente riceve un messaggio con ciò che manca ancora.</div><div class="arrow">→</div><div class="step"><b>4. Pannello aggiornato</b>Lo studio vede tutto aggiornato nello scadenzario.</div></div></div>';
}
function vUpload(id){
 var c=cl(id);if(!c)return '<div class="upload"><div class="card"><h2>Link non valido</h2></div></div>';
 var mancanti=DOCS.filter(function(d){return d.c===id&&d.st==='mancante'});
 var opts=(mancanti.length?mancanti.map(function(d){return d.tipo}):DOCTIPI);
 return '<div class="upload"><div class="card"><span class="demo-note">Demo con dati di esempio</span><h2>Carica un documento</h2><p class="sub" style="margin-bottom:14px">Cartella di '+esc(c.nome)+'</p><div class="row" style="display:block"><label for="utipo" style="display:block;margin-bottom:4px;color:var(--muted)">Che documento è?</label><select id="utipo" style="width:100%">'+opts.map(function(o){return '<option>'+esc(o)+'</option>'}).join('')+'</select></div><div class="row" style="display:block"><label for="ufile" style="display:block;margin-bottom:4px;color:var(--muted)">Scegli il file</label><input type="file" id="ufile" style="width:100%"></div><div id="uout"></div><button class="btn" id="usend" style="width:100%;text-align:center">Invia il documento</button><button class="btn sec" id="uback" style="width:100%;text-align:center;margin-top:8px">Torna al gestionale</button></div></div>';
}

/* ---------- shell e eventi ---------- */
var NAV=[['dash','Dashboard'],['ana','Anagrafica clienti'],['scad','Scadenzario'],['doc','Documenti'],['prat','Pratiche'],['fatt','Fatturazione'],['agenda','Agenda'],['how','Come funziona']];
function render(){
 var h=(location.hash||'').replace('#','');
 if(h.indexOf('carica-')===0){document.getElementById('root').innerHTML=vUpload(h.slice(7));bindUpload(h.slice(7));return}
 var v=state.view,main='';
 if(v==='dash')main=vDash();else if(v==='ana')main=state.cli?vCli():vAna();else if(v==='scad')main=vScad();else if(v==='doc')main=vDoc();else if(v==='prat')main=vPrat();else if(v==='fatt')main=vFatt();else if(v==='agenda')main=vAgenda();else main=vHow();
 var nav=NAV.map(function(n){var cnt='';if(n[0]==='scad'&&scadCount())cnt='<span class="count">'+scadCount()+'</span>';if(n[0]==='doc'&&docMancanti().length)cnt='<span class="count">'+docMancanti().length+'</span>';
  return '<button data-nav="'+n[0]+'"'+(v===n[0]?' aria-current="page"':'')+'>'+n[1]+cnt+'</button>'}).join('');
 document.getElementById('root').innerHTML='<div class="app"><aside class="side"><div class="brand">Gestionale Studio Commercialista<small>Versione dimostrativa</small></div><nav class="nav" aria-label="Sezioni">'+nav.replace('<button data-nav="how"','<span class="sep"></span><button data-nav="how"')+'</nav></aside><main>'+(v==='dash'?'<div class="mobile-note"><b>Stai vedendo la versione per telefono.</b> Dati di esempio. Sul computer il gestionale si apre a schermo intero, con menu laterale e tabelle complete.</div>':'')+(v==='how'?'':'<span class="demo-note">Demo con dati di esempio</span>')+main+'</main></div>';
 bind();
}
function go(v){state.view=v;state.cli=null;state.tab='dati';render();window.scrollTo(0,0)}
function bind(){
 var r=document.getElementById('root');
 [].forEach.call(r.querySelectorAll('[data-nav]'),function(b){b.onclick=function(){go(b.getAttribute('data-nav'))}});
 [].forEach.call(r.querySelectorAll('[data-open]'),function(tr){var f=function(){state.cli=tr.getAttribute('data-open');state.tab='dati';render();window.scrollTo(0,0)};tr.onclick=f;tr.onkeydown=function(e){if(e.key==='Enter')f()}});
 [].forEach.call(r.querySelectorAll('[data-tab]'),function(t){t.onclick=function(){state.tab=t.getAttribute('data-tab');render()}});
 var q=document.getElementById('q');if(q)q.oninput=function(){state.q=q.value;var p=q.selectionStart;render();var n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)};
 var sel=function(id,key){var e=document.getElementById(id);if(e)e.onchange=function(){state[key]=e.value;render()}};
 sel('freg','reg');sel('fcl','fcl');sel('ftipo','ftipo');sel('fst','fst');sel('doccl','doccl');
 var on=function(id,fn){var e=document.getElementById(id);if(e)e.onclick=fn};
 on('backana',function(){state.cli=null;render()});
 on('csvana',function(){exportCsv('clienti',['Cliente','Tipo','Regime','Partita IVA','Email','Telefono','Città'],CLIENTI.map(function(c){return [c.nome,c.tipo,c.regime,c.piva,c.email,c.tel,c.citta]}))});
 on('csvscad',function(){var rows=SCAD.filter(function(s){return (!state.fcl||s.c===state.fcl)&&(!state.ftipo||s.tipo===state.ftipo)&&(!state.fst||scadStato(s).t===state.fst)}).sort(function(a,b){return a.d-b.d});exportCsv('scadenzario',['Data','Tipo','Cliente','Descrizione','Stato'],rows.map(function(s){return [iso(s.d),s.tipo,cl(s.c).nome,s.desc,scadStato(s).t]}))});
 on('csvdoc',function(){exportCsv('documenti',['Cliente','Documento','Stato','Data'],DOCS.filter(function(d){return !state.doccl||d.c===state.doccl}).map(function(d){return [cl(d.c).nome,d.tipo,d.st,d.data?iso(d.data):'']}))});
 on('csvfatt',function(){exportCsv('fatturazione',['Numero','Cliente','Data','Importo','Stato'],PARC.map(function(p){return [p.n,cl(p.c).nome,iso(p.d),p.imp.toFixed(2).replace('.',','),p.st]}))});
 on('pcol',function(){state.pmode='colonne';render()});on('pel',function(){state.pmode='elenco';render()});
 on('calp',function(){state.calMonth--;render()});on('caln',function(){state.calMonth++;render()});
 on('npadd',function(){var t=document.getElementById('npt').value.trim();if(!t){toast('Scrivi prima la nota');return}PRAT[+document.getElementById('npprat').value].note.push({d:new Date(),t:t});toast('Nota salvata');render()});
 on('addnote',function(){var t=document.getElementById('newnote').value.trim();if(!t){toast('Scrivi prima la nota');return}(NOTE_CL[state.cli]=NOTE_CL[state.cli]||[]).unshift({d:new Date(),t:t});toast('Nota aggiunta');render()});
 var qc=document.getElementById('qrc');
 if(qc){var cid=state.view==='doc'?'c3':state.cli;qrFor(qc,cid);var qs=document.getElementById('qrsel');if(qs){qs.onchange=function(){qrFor(qc,qs.value);cid=qs.value};}
  on('provaqr',function(){location.hash='carica-'+(qs?qs.value:cid)})}
}
function bindUpload(id){
 document.getElementById('uback').onclick=function(){history.replaceState(null,'',location.href.split('#')[0]);state.view='doc';render()};
 document.getElementById('usend').onclick=function(){var f=document.getElementById('ufile').files[0];if(!f){document.getElementById('uout').innerHTML='<p style="color:var(--bad)">Scegli prima un file.</p>';return}
  var t=document.getElementById('utipo').value;DOCS.forEach(function(d){if(d.c===id&&d.tipo===t&&d.st==='mancante'){d.st='ricevuto';d.data=new Date();d.urg=null}});
  document.getElementById('uout').innerHTML='<p style="color:var(--ok);font-weight:600">Documento ricevuto. Grazie! Nella demo il file non viene salvato.</p>'}
}
window.addEventListener('hashchange',render);
render();
})();
</script>
